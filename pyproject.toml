[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-siavash-el-ai"
version = "0.1.0"
description = "Secure Telegram interface for the MR_SIAVASH AI ecosystem"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "keyring>=25,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1",
]

[project.scripts]
el-ai = "el_ai.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
